name: release

# Manually triggered. Enter the version (e.g. 0.2.0); the release is tagged
# v<version>. Builds hcc + holyc-lsp for Linux (amd64/arm64), macOS (arm64 and
# Intel), and Windows (amd64), packages them as the assets install.sh/install.ps1
# expect, and publishes a GitHub release at the current commit.
#
# Windows note: hcc links libLLVM dynamically, and the official LLVM Windows
# installer ships no libLLVM. We use MSYS2's mingw libLLVM instead, build the
# `x86_64-windows-gnu` target, and bundle libLLVM.dll + its mingw runtime deps
# into the asset (install.ps1 installs them beside hcc.exe).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.2.0 (tag will be v<version>)"
        required: true

permissions:
  contents: write # create the tag and release

env:
  ZIG_VERSION: "0.16.0"

jobs:
  build:
    name: build ${{ matrix.arch }}-${{ matrix.osfrag }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45 # a stuck runner fails fast instead of hanging the release
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest,    os: linux,   arch: amd64, osfrag: linux }
          - { runner: ubuntu-24.04-arm, os: linux,   arch: arm64, osfrag: linux }
          - { runner: macos-14,         os: darwin,  arch: arm64, osfrag: apple-darwin }
          - { runner: macos-13,         os: darwin,  arch: amd64, osfrag: apple-darwin }
          - { runner: windows-latest,   os: windows, arch: amd64, osfrag: windows }
    steps:
      - uses: actions/checkout@v4

      # Windows libLLVM comes from MSYS2's mingw toolchain (the only readily
      # available shared libLLVM for Windows). The build targets windows-gnu to
      # match it.
      - name: Set up MSYS2 + mingw libLLVM (Windows)
        if: matrix.os == 'windows'
        uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-llvm

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      # hcc links libLLVM dynamically, so each runner needs LLVM 21 to build and
      # link. The prefix is passed to `zig build -Dllvm-prefix`.
      - name: Install LLVM 21 (Linux)
        if: matrix.os == 'linux'
        run: |
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get install -y llvm-21-dev
          echo "LLVM_PREFIX=/usr/lib/llvm-21" >> "$GITHUB_ENV"

      - name: Install LLVM 21 (macOS)
        if: matrix.os == 'darwin'
        run: |
          brew install llvm@21
          echo "LLVM_PREFIX=$(brew --prefix llvm@21)" >> "$GITHUB_ENV"

      # Only the shipped artifacts (hcc + holyc-lsp + std); the e2e/bench
      # harnesses are not part of a release.
      - name: Build (Linux/macOS)
        if: matrix.os != 'windows'
        run: zig build hcc lsp -Doptimize=ReleaseSafe -Dllvm-prefix="$LLVM_PREFIX"

      - name: Build (Windows)
        if: matrix.os == 'windows'
        run: |
          $prefix = "${{ steps.msys2.outputs.msys2-location }}\mingw64"
          zig build hcc lsp -Dtarget=x86_64-windows-gnu -Doptimize=ReleaseSafe "-Dllvm-prefix=$prefix"

      # Asset layout install.sh expects:
      #   hcc-<tag>-<arch>-<osfrag>.tar.gz        → hcc binary + the std/ tree
      #   holyc-lsp-<tag>-<arch>-<osfrag>.tar.gz  → holyc-lsp binary
      - name: Package (Linux/macOS)
        if: matrix.os != 'windows'
        run: |
          V="${{ inputs.version }}"; V="${V#v}"; TAG="v$V"
          A="${{ matrix.arch }}-${{ matrix.osfrag }}"
          mkdir -p dist stage
          cp zig-out/bin/hcc stage/ && cp -R zig-out/std stage/std
          tar -czf "dist/hcc-$TAG-$A.tar.gz" -C stage hcc std
          rm -rf stage && mkdir stage
          cp zig-out/bin/holyc-lsp stage/
          tar -czf "dist/holyc-lsp-$TAG-$A.tar.gz" -C stage holyc-lsp

      # The Windows hcc.exe carries libLLVM.dll + its mingw runtime deps (found
      # via ldd) at the archive root; install.ps1 installs them beside hcc.exe.
      - name: Package (Windows)
        if: matrix.os == 'windows'
        shell: msys2 {0}
        run: |
          V="${{ inputs.version }}"; V="${V#v}"; TAG="v$V"
          A="amd64-windows"
          mkdir -p dist stage
          cp zig-out/bin/hcc.exe stage/
          cp -r zig-out/std stage/std
          ldd zig-out/bin/hcc.exe | awk '/\/mingw64\// {print $3}' | sort -u | while read -r dll; do
            cp -n "$dll" stage/ 2>/dev/null || true
          done
          tar -czf "dist/hcc-$TAG-$A.tar.gz" -C stage .
          rm -rf stage && mkdir stage
          cp zig-out/bin/holyc-lsp.exe stage/
          tar -czf "dist/holyc-lsp-$TAG-$A.tar.gz" -C stage holyc-lsp.exe

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.arch }}-${{ matrix.osfrag }}
          path: dist/*.tar.gz

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum *.tar.gz > SHA256SUMS

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ inputs.version }}"; V="${V#v}"; TAG="v$V"
          gh release create "$TAG" dist/*.tar.gz dist/SHA256SUMS \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "holyc $TAG" \
            --generate-notes
